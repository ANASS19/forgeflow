name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12.10 has official setup-python builds for Ubuntu 24.04, not 26.04.
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.7.6'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --no-python-downloads
      - name: Check lockfile
        run: uv lock --check
      - name: Test
        run: uv run --locked pytest
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type-check
        run: uv run --locked mypy
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - name: Exercise the real CLI demonstration
        run: uv run --locked python examples/demo.py
      - name: CLI help
        run: uv run --locked forgeflow --help
