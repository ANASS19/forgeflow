[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "forgeflow"
dynamic = ["version"]
description = "A local-first workflow execution and debugging system for API developers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ForgeFlow contributors" }]
keywords = ["workflow", "debugging", "cli", "local-first", "api"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.16,<2",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
]

[project.scripts]
forgeflow = "forgeflow.cli:app"

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.version]
path = "src/forgeflow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeflow"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/ROADMAP.md",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/LICENSE",
    "/.python-version",
    "/.gitignore",
    "/.gitattributes",
]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
xfail_strict = true
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples/demo.py"]
